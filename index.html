<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>나만의 라디오</title>
<meta name="description" content="한국 주요 방송과 해외 영어권 라디오를 한 화면에서 바로 듣는 라디오">
<meta name="theme-color" content="#3d2a1d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg?v=2" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="라디오">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
/* VOICE: 오래 써서 손때 묻은 거실 진공관 라디오 — 따뜻하고 단정함
   IDEA: 호두나무 캐비닛, 상아색 주파수 창(켜면 불이 들어옴), 황동 볼륨 노브, 아래는 프리셋 버튼 줄
   PICTURE: 캐비닛 한 대가 첫 화면을 채움 — 다이얼 창·방송 이름·조작부가 한 몸
   COLOUR and TYPE: 호두 #3d2a1d, 상아 #f0e4c8, 황동 #c49a4a, 바늘만 적갈색 #b3261e; 바탕은 바랜 종이 #f2ebdf; IBM Plex Sans KR
   LAYOUT: 머리줄 → 캐비닛(가운데, 최대 880px) → 출력·취침 도구줄 → 한 줄 탭 → 한 줄 장르 → 채널 그리드 */
:root{color-scheme:light dark;
 --bg:light-dark(#f2ebdf,#15110d);--ink:light-dark(#2a1f17,#f1e6d2);--mute:light-dark(#76665a,#a8977f);
 --line:light-dark(#dccfba,#3a2f25);--card:light-dark(#fbf7ef,#211a14);--cur:light-dark(#f3e5c6,#33261a);
 --wal:#3d2a1d;--wal2:#2c1e14;--ivory:#f0e4c8;--brass:#c49a4a;--brass-l:#e8cd8e;--brass-d:#7f5b22;--needle:#b3261e}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans KR",system-ui,sans-serif;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid #2f7cf6;outline-offset:2px}
.band{padding:clamp(16px,3vw,36px) max(4vw,16px)}
.wrap{max-width:880px;margin:0 auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* 머리줄 */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;max-width:880px;margin:0 auto 14px}
.top h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em}
.tr{display:flex;gap:12px;align-items:center}
.clock{font-variant-numeric:tabular-nums;color:var(--mute);font-size:14px}
.inst{background:var(--wal);color:var(--ivory);border:0;border-radius:99px;padding:8px 16px;min-height:40px;font-weight:700}
.inst[hidden]{display:none}
/* 캐비닛 */
.cab{max-width:880px;margin:0 auto;border-radius:22px;padding:clamp(14px,2.4vw,24px);color:var(--ivory);
 background:linear-gradient(100deg,#47301f 0%,#3a281b 22%,#4b3322 46%,#36251a 70%,#443020 100%);
 box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 -8px 18px rgba(0,0,0,.3) inset,0 14px 30px -14px rgba(40,25,10,.55)}
.dial{position:relative;height:62px;border-radius:12px;background:#e6d8b8;overflow:hidden;
 box-shadow:0 0 0 3px var(--brass-d),0 0 0 4px var(--brass),inset 0 3px 8px rgba(60,40,20,.35);transition:background .6s,box-shadow .6s}
.dial svg{position:absolute;inset:0;width:100%;height:100%}
.playing .dial{background:#f7e6b5;box-shadow:0 0 0 3px var(--brass-d),0 0 0 4px var(--brass),inset 0 0 26px rgba(255,170,60,.65)}
.needle{position:absolute;top:6px;bottom:6px;width:3px;background:var(--needle);border-radius:2px;transition:left .7s cubic-bezier(.3,1.4,.5,1)}
.now{display:flex;gap:10px;align-items:flex-start;margin-top:18px}
.now-l{flex:1}
.now-tag{font-size:13px;color:#d9c9a6;display:flex;gap:8px;align-items:center}
.pill{border:1px solid rgba(240,228,200,.5);border-radius:99px;padding:0 10px;line-height:22px}
.playing .pill{background:var(--brass);border-color:var(--brass);color:var(--wal2);font-weight:700}
.now-name{font-size:clamp(28px,4.6vw,44px);line-height:1.08;font-weight:700;margin:6px 0 4px;text-wrap:balance}
.now-desc{color:#d9c9a6;font-size:15px;min-height:1.5em}
.mrow{display:flex;align-items:flex-end;gap:14px;margin:14px 0 16px}
.meter{flex:1;display:flex;gap:4px;align-items:flex-end;height:26px}
.lamp[hidden]{display:none}
.lamp{flex:none;display:flex;align-items:center;gap:7px;font-size:13px;color:#d9c9a6;white-space:nowrap}
.lamp::before{content:"";width:9px;height:9px;border-radius:50%;background:#5a4433;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.playing .lamp{color:var(--brass-l);font-weight:700}.playing .lamp::before{background:#ffb347;box-shadow:0 0 8px 2px rgba(255,170,60,.7)}
.meter i{flex:1;max-width:9px;height:100%;background:var(--brass);border-radius:2px;opacity:.35;transform:scaleY(.08);transform-origin:50% 100%}
.playing .meter i{opacity:.95}
@media(prefers-reduced-motion:reduce){.needle,.dial{transition:none}}
.panel{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid rgba(240,228,200,.16);padding-top:12px}
.transport{display:flex;align-items:center;gap:12px}
.rb{width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;color:var(--wal2);
 background:radial-gradient(circle at 35% 30%,#fbf3df,#e2d2ad 70%,#c9b48a);box-shadow:0 2px 0 rgba(0,0,0,.35),inset 0 -2px 3px rgba(0,0,0,.15)}
.rb svg{width:22px;height:22px;fill:currentColor}
.rb.big{width:60px;height:60px;color:var(--wal2);background:radial-gradient(circle at 35% 30%,var(--brass-l),var(--brass) 55%,var(--brass-d))}
.rb.big svg{width:26px;height:26px}
.rb:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
/* 볼륨 노브 */
.vol{display:flex;align-items:center;gap:6px}
.kwrap{position:relative;width:74px;height:74px;display:grid;place-items:center}
.kwrap svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.knob{--a:0deg;width:56px;height:56px;border-radius:50%;touch-action:none;cursor:grab;position:relative;
 background:repeating-conic-gradient(from 0deg,rgba(0,0,0,.18) 0 4deg,rgba(255,255,255,.08) 4deg 8deg),radial-gradient(circle at 35% 30%,var(--brass-l),var(--brass) 55%,var(--brass-d));
 box-shadow:0 3px 0 rgba(0,0,0,.4),inset 0 -3px 5px rgba(0,0,0,.25);transform:rotate(var(--a))}
.knob::after{content:"";position:absolute;left:50%;top:3px;width:4px;height:9px;margin-left:-2px;border-radius:2px;background:var(--wal2)}
.knob:active{cursor:grabbing}
.vstep{width:44px;height:44px;border:1px solid rgba(240,228,200,.28);border-radius:50%;background:none;color:var(--ivory);display:grid;place-items:center}
.vstep svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.vstep:active{background:rgba(240,228,200,.15)}
.kcap{position:absolute;left:50%;top:50%;width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;pointer-events:none;display:grid;place-items:center;
 background:radial-gradient(circle at 40% 35%,#4a3324,#2c1e14);box-shadow:0 1px 0 rgba(255,255,255,.15),inset 0 1px 3px rgba(0,0,0,.6);
 color:var(--ivory);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kcap.muted{color:var(--brass-l);font-size:10px}
/* 도구줄 */
.tools{max-width:880px;margin:12px auto 0;display:flex;gap:10px;align-items:stretch}
.segs{flex:1;display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--wal);border-radius:12px}.seg:first-child{border-radius:10px 0 0 10px}.seg:last-child{border-radius:0 10px 10px 0}
:root:not([data-theme=light]) .segs{border-color:light-dark(var(--wal),#6b5440)}
.seg{border:0;background:none;min-height:44px;font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px}
.seg svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}
.seg[aria-pressed=true]{background:var(--wal);color:var(--ivory)}
.seg{position:relative;white-space:nowrap}.on-badge{display:none;position:absolute;top:-8px;right:8px;z-index:1;font-style:normal;font-size:9px;line-height:14px;font-weight:800;letter-spacing:.04em;padding:1px 6px;border-radius:99px;background:#ffb347;color:#3a1f05;box-shadow:0 0 8px 1px rgba(255,170,60,.75)}
.seg.live .on-badge{display:inline-block}
.cap{margin:-4px 0 14px;border-radius:12px;background:rgba(15,9,5,.45);box-shadow:inset 0 2px 6px rgba(0,0,0,.4);padding:10px 12px 12px}
.cap[hidden],.capon[hidden]{display:none}
.caph{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.capt{flex:1;font-size:12px;color:var(--brass-l);font-weight:700}.capt small{font-weight:400;color:#bfae8c}
.capb{border:1px solid rgba(240,228,200,.3);background:none;color:#d9c9a6;border-radius:99px;font-size:12px;padding:3px 10px;min-height:28px}
.capb[aria-pressed=true]{background:var(--brass);border-color:var(--brass);color:var(--wal2);font-weight:700}
.capx{height:5.8em;overflow:hidden;position:relative;font-size:17px;line-height:1.45;color:var(--ivory);-webkit-mask-image:linear-gradient(#0000,#000 .2em,#000 calc(100% - .4em),#0000);mask-image:linear-gradient(#0000,#000 .2em,#000 calc(100% - .4em),#0000)}
.capen.wait{color:#bfae8c;font-size:14px}
.capen{position:relative;color:#a8977f;transition:transform .55s cubic-bezier(.25,.8,.3,1)}.capen span{transition:color .25s}
.capen .wp{color:#ddd0b3}.capen .wb{color:#fff7e2;-webkit-text-stroke:.55px currentColor}
.capko{display:none;font-size:16px;line-height:1.45;color:var(--brass-l);min-height:2.9em;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cap.ko .capx{height:2.9em;font-size:15px;color:#cdbd9a}.cap.ko .capko{display:-webkit-box}
.capon{margin:-6px 0 12px;border:1px dashed rgba(240,228,200,.35);background:none;color:#d9c9a6;border-radius:99px;font-size:13px;padding:4px 12px;min-height:32px}
.slp{position:relative;flex:none;display:flex;align-items:center;gap:6px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;min-height:44px;font-weight:700;color:var(--ink);white-space:nowrap}
.slp svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8}
.pwr{flex:none;display:flex;align-items:center;gap:6px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;min-height:44px;font-weight:700;background:none;color:var(--mute);white-space:nowrap}
.pwr svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
.pwr.live{color:#fff;background:#8c2f1f;border-color:#8c2f1f;box-shadow:0 2px 0 #5c1d12}
.pwr.live:active{transform:translateY(1px);box-shadow:none}
.slp.on{border-color:var(--brass);background:light-dark(#f3e5c6,#33261a)}
.slp select{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer;font-size:16px}
.slp:focus-within{outline:3px solid #2f7cf6;outline-offset:2px}
.status{max-width:880px;margin:8px auto 0;font-size:13px;color:var(--mute);display:flex;gap:4px 12px;flex-wrap:wrap}.status:not(:has(span:not(:empty))){display:none}
/* 탭: 한 줄, 크게 */
.tabs::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 0 11px;font-size:18px;font-weight:700;color:var(--mute);white-space:nowrap;margin-bottom:-1px;text-align:center}
.tab sup{font-size:11px;margin-left:2px;color:var(--brass-d)}
.tab[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--brass)}
/* 장르: 한 줄 */
.chiprow{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.chips{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:0 4px;min-height:40px;font-size:15px;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qbtn{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.qbtn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
.qbtn[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.qrow{margin:-4px 0 14px}.qrow[hidden]{display:none}
.search{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:44px;background:var(--card);font-size:16px}
/* 채널 카드 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px 10px;padding-bottom:6px}
.st{position:relative;text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none;border-radius:16px;padding:10px 14px 11px;min-height:62px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:1px;background:linear-gradient(light-dark(#fffaf0,#2b221a),light-dark(#efe3cc,#1d1711));border:1px solid light-dark(#d3bf9a,#4a3b2c);box-shadow:inset 0 1px 0 light-dark(#fff,rgba(255,255,255,.08)),inset 0 -3px 0 light-dark(rgba(120,90,50,.10),rgba(0,0,0,.25)),0 5px 0 light-dark(#c9b28a,#0a0806),0 8px 12px -6px rgba(50,30,10,.45);transition:transform .07s,box-shadow .07s}
.st:active{transform:translateY(4px);box-shadow:inset 0 1px 0 light-dark(#fff,rgba(255,255,255,.06)),0 1px 0 light-dark(#c9b28a,#0a0806),0 2px 4px -2px rgba(50,30,10,.4)}
.st:hover{border-color:var(--brass)}
.st.cur{border-color:#2a1c12;background:linear-gradient(#3f2b1e,#4b3423);color:var(--ivory);transform:translateY(4px);box-shadow:inset 0 3px 6px rgba(0,0,0,.45),0 1px 0 #1d140d,0 0 0 2px var(--brass)}
.st.cur span{color:#d9c9a6}
.st b{display:block;width:100%;font-size:18px;line-height:1.25;letter-spacing:-.01em;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st span{font-size:13px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.st .num{position:absolute;left:-6px;top:-6px;width:20px;height:20px;border-radius:50%;font-size:11px;font-weight:700;background:var(--brass);color:var(--wal2);display:grid;place-items:center}
.empty{color:var(--mute);padding:20px 0}
/* 아래 설정 */
h2{font-size:20px;margin:0 0 6px}
.lead{color:var(--mute);margin:0 0 14px;max-width:70ch;font-size:15px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px}
.box{border-top:2px solid var(--wal);padding-top:16px}
.field{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.field input{flex:1 1 180px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;background:var(--card);font-size:16px}
.btn{border:0;border-radius:10px;padding:10px 18px;min-height:44px;background:var(--wal);color:var(--ivory);font-weight:600}
.res{list-style:none;padding:0;margin:0;max-height:360px;overflow:auto}
.res li{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:6px 0}
.res li div{flex:1}
.res small{color:var(--mute);display:block;font-size:13px}
.res button{min-height:40px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.small{font-size:13px;color:var(--mute)}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:13px;white-space:nowrap}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:15px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--wal);color:var(--ivory);padding:10px 18px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;z-index:9}
.toast.show{opacity:1}
footer{color:var(--mute);font-size:13px}
@media(max-width:600px){
 .dial{height:52px}.now{margin-top:14px}.meter{height:18px;margin:10px 0 12px}
 .panel{gap:6px;padding-top:10px}.transport{gap:8px}.rb{width:42px;height:42px}.rb.big{width:54px;height:54px}.rb svg{width:19px;height:19px}
 .kwrap{width:66px;height:66px}.knob{width:50px;height:50px}.vstep{width:38px;height:38px}.vstep svg{width:18px;height:18px}.vol{gap:3px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.st{padding:8px 10px 9px;min-height:58px}.st b{font-size:16.5px}.st b{font-size:17px}.st span{font-size:12px}
 .tab{font-size:16px}.top h1{font-size:18px}.slp{padding:0 12px}
 .clock{display:none}.inst{min-height:36px;padding:6px 14px;font-size:14px}.chip{font-size:14px}
 .tools{gap:6px}.seg svg{display:none}.slp,.pwr{padding:0 10px;gap:4px}}
@media(max-width:360px){.tab{font-size:15px}.slp span,.pwr span{display:none}}
</style>
</head>
<body>
<section class="band" id="player" style="padding-bottom:8px">
 <div class="top"><h1>나만의 라디오</h1><div class="tr"><span class="clock" id="clock"></span><button class="inst" id="install" hidden>앱으로 설치</button></div></div>
 <div class="cab">
  <div class="dial" aria-hidden="true"><svg id="scale"></svg><div class="needle" id="needle" style="left:10%"></div></div>
  <div class="now">
   <div class="now-l">
    <div class="now-name" id="nowName">채널을 고르세요</div>
    <div class="now-desc" id="nowDesc">아래 채널을 누르면 바로 재생됩니다.</div>
   </div>
  </div>
  <div class="mrow"><div class="meter" aria-hidden="true" id="meter"></div><span class="lamp" id="state" role="status" hidden>대기 중</span></div>
  <div class="cap" id="cap" hidden>
   <div class="caph"><span class="capt">실시간 자막 <small id="capNote">· 영어</small></span><button class="capb" id="capKo" aria-pressed="false">한글</button><button class="capb" id="capOff">끄기</button></div>
   <div class="capx" id="capx"><div class="capen" id="capEn"></div></div>
   <div class="capko" id="capKoLine" aria-live="polite"></div>
  </div>
  <button class="capon" id="capOn" hidden>자막 켜기</button>
  <div class="panel">
   <div class="transport">
    <button class="rb" id="prev" aria-label="이전 채널" title="이전 채널 (←)"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
    <button class="rb big" id="play" aria-label="재생/정지" title="재생/정지 (Space)"><svg viewBox="0 0 24 24" id="playIco"><path d="M7 4v16l13-8z"/></svg></button>
    <button class="rb" id="next" aria-label="다음 채널" title="다음 채널 (→)"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
   </div>
   <div class="vol">
    <button class="vstep" id="volDown" aria-label="소리 줄이기"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
    <div class="kwrap"><svg id="kticks" viewBox="0 0 86 86" aria-hidden="true"></svg>

const CAP_SEC=10,START_BUF=12;let mse=null;

const joinU8=a=>{let n=0;for(const x of a)n+=x.length;const o=new Uint8Array(n);let i=0;for(const x of a){o.set(x,i);i+=x.length}return o};

 await new Promise(r=>ms.addEventListener('sourceopen',r,{once:true}));if(my.dead)return;

 const end=()=>sb.buffered.length?sb.buffered.end(sb.buffered.length-1):0;
 const pump=()=>{if(my.dead||sb.updating||!my.q.length)return;const c=joinU8(my.q);my.q=[];my.pend=c;
  try{sb.appendBuffer(c)}catch(e){my.q.unshift(c);my.pend=null}};

  if(my.pend){my.bytes.push(my.pend);my.pend=null;const e=end();
   if(e-my.start>=CAP_SEC){capSend(my,joinU8(my.bytes),my.start,e);my.start=e;my.bytes=[]}
   if(!my.started&&e>=START_BUF){my.started=1;s._mseFail=0;au.play().catch(blocked)}
   const t=au.currentTime;if(t>60&&sb.buffered.start(0)<t-45){try{sb.remove(0,t-30);return}catch(x){}}}
  pump()});
 sb.addEventListener('error',()=>netFail());

 $('#capKoLine').textContent='';$('#capNote').textContent=mode==='sync'?'· 영어 · 소리에 맞춤':mode==='pcsync'?'· 영어 · PC 소리에 맞춤':'· 영어 · 몇 초 늦음'};
// 받아쓴 조각 → 단어마다 '재생 시계로 몇 초에 들리는지'를 붙여 자막 끝에 이어 붙임 (이미 놓인 줄은 건드리지 않음)
// wt: [[단어, 조각 안 시작초, 끝초], …] (받아쓰기가 알려 준 단어별 시간). 없으면 조각 시간에 고르게 나눔.
const capSeg=(start,end,text,wt)=>{let ws=[];
 if(wt&&wt.length)for(const[x,s]of wt){const c=String(x).replace(/^(\.{2,}|…)/,'').replace(/(\.{2,}|…)$/,'');if(c)ws.push({w:c,t:start+s,g:start})}
 if(!ws.length){const p=text.split(' ').filter(Boolean);ws=p.map((w,i)=>({w,t:start+(end-start)*i/p.length,g:start}))}
 if(!ws.length)return;CAP.end=Math.max(CAP.end,end,ws[ws.length-1].t+.3);
 const el=$('#capEn');if(el.classList.contains('wait')){el.classList.remove('wait');el.textContent=''}
 const L=CAP.list;let at=L.length;while(at>0&&L[at-1].g>start)at--;  // 늦게 도착한 앞 조각은 제자리에 끼워 넣음
 const frag=document.createDocumentFragment();for(const x of ws){x.el=document.createElement('span');x.el.textContent=x.w;frag.append(x.el,' ')}
 el.insertBefore(frag,at<L.length?L[at].el:null);L.splice(at,0,...ws);CAP.now=-2};
// 앱이 재생 중인 소리 조각 → 받아쓰기
const toWav=async u8=>{const b=await new OfflineAudioContext(1,16000,16000).decodeAudioData(u8.buffer.slice(u8.byteOffset,u8.byteOffset+u8.length));
 const n=Math.round(b.duration*16000),oc=new OfflineAudioContext(1,n,16000),src=oc.createBufferSource();src.buffer=b;src.connect(oc.destination);src.start();
 const d=(await oc.startRendering()).getChannelData(0),o=new DataView(new ArrayBuffer(44+n*2)),S=(i,t)=>{for(let k=0;k<t.length;k++)o.setUint8(i+k,t.charCodeAt(k))};
 S(0,'RIFF');o.setUint32(4,36+n*2,true);S(8,'WAVEfmt ');o.setUint32(16,16,true);o.setUint16(20,1,true);o.setUint16(22,1,true);o.setUint32(24,16000,true);o.setUint32(28,32000,true);o.setUint16(32,2,true);o.setUint16(34,16,true);S(36,'data');o.setUint32(40,n*2,true);
 for(let i=0;i<n;i++)o.setInt16(44+i*2,Math.max(-1,Math.min(1,d[i]))*32767,true);return new Uint8Array(o.buffer)};
const capSend=async(my,bytes,start,end)=>{if(!capOn)return;
 if(my.s.mime==='audio/aac')try{bytes=await toWav(bytes)}catch(e){return}
 fetch(`${WORKER}/transcribe?prompt=${encodeURIComponent(CAP.prompt.slice(-200))}`,{method:'POST',body:bytes})
  .then(r=>r.json()).then(j=>{if(!((my===mse&&CAP.mode==='sync')||(my===fol&&CAP.mode==='pcsync')))return;const t=capClean(j.text);if(!t)return;
   CAP.prompt=(CAP.prompt+' '+t).slice(-400);capSeg(start,end,t,j.words)}).catch(()=>{})};
// PC 스피커 등: 워커가 방송을 직접 몇 초 받아써 줌. 받는 즉시 이어서 흘려 보여 줌.
const capLoop=async()=>{const my=capRun,s=cur;
 while(my===capRun&&capOn&&capShow()&&cur===s){
  try{const r=await fetch(`${WORKER}/caption?id=${s.cap}`,{cache:'no-store'});const j=await r.json();
   if(my!==capRun)return;const t=capClean(j.text);
   if(t){const now=performance.now()/1000,last=CAP.end,st=Math.max(now,last);capSeg(st,st+5,t,j.words)}
   else if(j.error)await new Promise(z=>setTimeout(z,5000))}
  catch(e){await new Promise(z=>setTimeout(z,5000))}}};
// 0.12초마다: 지금 말하는 단어와 앞뒤 1개를 조금 굵게 (글자 폭은 그대로라 줄바꿈이 흔들리지 않음).
// 지금 읽는 줄은 늘 둘째 줄(한글 켬이면 첫 줄)에 머물고, 말이 다음 줄로 넘어가면 자막 전체가 한 줄 위로 부드럽게 올라감.
// 받아 둔 다음 말은 아래 줄에 흐리게 미리 보임. 받아쓰기 단어 시간이 소리보다 조금 늦게 잡히는 편이라 0.4초 앞당겨 맞춤.
const CAP_LEAD=.4;
const capCls=(i,n)=>n>=0&&i>=n-1&&i<=n+1?'wb':i<n?'wp':'';
const capTick=()=>{const L=CAP.list;if(!L.length)return;
 const t=capClock()+(CAP.mode!=='live'?CAP_LEAD:0);let n=-1;for(let i=0;i<L.length;i++)if(L[i].t<=t)n=i;
 if(n!==CAP.now){const p=CAP.now,all=p<-1,lo=all?0:Math.max(0,Math.min(n,p)-1),hi=all?L.length-1:Math.min(L.length-1,Math.max(n,p)+1);
  for(let i=lo;i<=hi;i++){const c=capCls(i,n);if(L[i].el.className!==c)L[i].el.className=c}CAP.now=n;
  // 한글: 방금 끝난 영어 문장을 번역
  if(capKo&&n>=0){const m=L.slice(Math.max(0,n-80),n+1).map(x=>x.w).join(' ').match(/[^.?!]+[.?!]+(?=\s|$)/g),sent=m&&m[m.length-1].trim();
   if(sent&&sent!==CAP.lastSent){CAP.lastSent=sent;const my=capRun;
    fetch(`${WORKER}/translate?text=${encodeURIComponent(sent)}`).then(r=>r.json()).then(j=>{if(my===capRun&&j.ko)$('#capKoLine').textContent=j.ko}).catch(()=>{})}}}
 const el=$('#capEn'),lh=parseFloat(getComputedStyle(el).lineHeight)||24,row=capKo?0:1,lineOf=s=>Math.floor((s.offsetTop+lh/2)/lh);
 const line=lineOf(L[Math.max(0,n)].el),y=-Math.round(Math.max(0,line-row)*lh);
 if(y!==CAP.y){CAP.y=y;CAP.moved=performance.now();el.style.transform=`translateY(${y}px)`;return}
 // 한참 위로 지나간 줄은 지움. 지운 줄 수만큼 위치를 되돌려 보이는 화면은 그대로.
 if(line>row+20&&performance.now()-CAP.moved>800){const cut=line-row-2;let k=0;while(k<n&&lineOf(L[k].el)<cut)k++;if(!k)return;
  while(el.firstChild&&el.firstChild!==L[k].el)el.firstChild.remove();L.splice(0,k);CAP.now-=k;
  const y2=-Math.round(Math.max(0,lineOf(L[n-k].el)-row)*lh);el.style.transition='none';el.style.transform=`translateY(${y2}px)`;el.offsetHeight;el.style.transition='';CAP.y=y2}};
let wake=null,wakeAsk=false;
const wakeUi=on=>{if(on){if(wake||wakeAsk||!('wakeLock' in navigator)||document.visibilityState!=='visible')return;wakeAsk=true;
  navigator.wakeLock.request('screen').then(w=>{wakeAsk=false;wake=w;w.addEventListener('release',()=>{if(wake===w)wake=null});
   if($('#cap').hidden){w.release().catch(()=>{});wake=null}}).catch(()=>{wakeAsk=false})}
 else if(wake){const w=wake;wake=null;w.release().catch(()=>{})}};
// 앱을 잠깐 내렸다 다시 열면 화면 켜 두기가 풀리므로 다시 요청
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wakeUi(!$('#cap').hidden)});
const capUi=()=>{const show=capShow();$('#cap').hidden=!(show&&capOn);wakeUi(show&&capOn);$('#capOn').hidden=!(show&&!capOn);$('#cap').classList.toggle('ko',capKo);
 if(show&&capOn){const mode=mse&&mse.s===cur?'sync':out==='pc'&&playing&&pcCode&&!cur._nofol?'pcsync':'live';
  if(capFor!==cur||CAP.mode!==mode){capFor=cur;capReset(mode);if(mode==='live')capLoop();if(mode==='pcsync')pcFollow(cur);else folStop()}
  if(!capT)capT=setInterval(capTick,120)}
 else{capRun++;capFor=null;CAP.mode='';folStop();if(capT){clearInterval(capT);capT=null}}};
// PC 스피커로 들을 때: PC 스피커 창이 자기가 곧 낼 소리를 받아써서, 단어마다 '스피커에서 나오는 시각'을 붙여
// 워커의 자막 우편함(/pccap)에 넣어 둠. 폰은 2초마다 읽어 와 그 시각에 맞춰 짚음 (두 기기 모두 워커 시계로 맞춤).
// 40초 동안 아무것도 안 오면(예전 PC 스피커 창) 워커가 직접 받아쓰는 '몇 초 늦음' 방식으로.
const folStop=()=>{if(fol){fol.dead=1;fol=null}};
const pcFollow=async s=>{folStop();const my=fol={s,dead:0,after:0,off:0,rtt:1e9,seen:new Set(),t0:Date.now(),got:0};
 while(!my.dead&&fol===my){
  try{const t0=Date.now(),r=await fetch(`${WORKER}/pccap?k=${encodeURIComponent(pcCode)}&after=${my.after}`,{cache:'no-store'}),j=await r.json(),t1=Date.now();
   if(my.dead)return;
   if(j.now&&t1-t0<my.rtt+50){my.rtt=Math.min(my.rtt,t1-t0);my.off=j.now-(t0+t1)/2}
   if(j.ch===s.cap)for(const g of j.segs||[]){my.after=Math.max(my.after,g.at);if(my.seen.has(g.id))continue;my.seen.add(g.id);my.got=1;
    const t=capClean(g.text);if(t){CAP.prompt=t;capSeg(g.s/1000,g.e/1000,t,g.words)}}}catch(e){}
  if(!my.got&&Date.now()-my.t0>40000){s._nofol=1;folStop();capUi();return}
  await new Promise(z=>setTimeout(z,2000))}};
// PC 스피커 (노트4 서버 경유)
let es=null,pcWait=null;
const castOf=s=>s.kbs?{kind:'kbs',v:String(s.kbs)}:s.sbs?{kind:'sbs',v:s.sbs}:s.mbc?{kind:'mbc',v:s.mbc}:{kind:'url',v:s.u};
const pcInfo=()=>{};
const pcTimeout=(ms,msg)=>{clearTimeout(pcWait);pcWait=setTimeout(()=>{if(out!=='pc')return;want=false;setPlaying(false);setState('응답 없음');pcInfo('노트4 서버 응답 없음');toast(msg)},ms)};
const pcCast=s=>{if(!pcCode){setOut('phone');toast('PC 스피커 연결 링크로 이 앱을 한 번 열어 주세요');return}
 setState('PC로 보내는 중…');pcInfo('');pcListen();
 pcSend(Object.assign({a:'cast',name:s.n,vol:muted?0:+volEl.value,id:Date.now()},castOf(s),s.cap?{cap:s.cap,mime:s.mime||''}:{}));
 pcTimeout(20000,'노트4 서버가 응답하지 않아요. 노트4가 켜져 있고 와이파이에 연결돼 있는지 확인해 주세요.')};
const pcState=m=>{if(!m||m.t!=='st'||out!=='pc')return;clearTimeout(pcWait);
 if(!m.online){want=false;setPlaying(false);setState('PC 꺼짐');pcInfo('PC가 꺼져 있거나 절전 중이에요');toast('PC가 꺼져 있거나 절전 중이에요. PC를 깨운 뒤 1분쯤 지나 다시 눌러 주세요.');return}
 pcInfo(m.on?`PC: ${String(m.title||'').replace(/^\S+\s/,'')} · 소리 ${m.vol}%`:'PC 스피커 연결됨');
 if(m.on){want=true;setPlaying(true);setState('PC에서 재생 중')}
 else{want=false;setPlaying(false);setState(m.re==='cast'?'PC 재생 실패':'정지')}};
const pcListen=()=>{if(es||!pcCode||!window.EventSource)return;
 es=new EventSource(`${NTFY}/${pcCode}-radio-st/sse`);
 es.addEventListener('message',e=>{try{const d=JSON.parse(e.data);pcState(JSON.parse(d.message))}catch(x){}})};
const pcClose=()=>{if(es){es.close();es=null}clearTimeout(pcWait)};
const outUi=()=>{phoneOn();$('#outPhone').setAttribute('aria-pressed',out==='phone');$('#outPc').setAttribute('aria-pressed',out==='pc');if(out!=='pc')pcInfo('')};
const setOut=o=>{if(o===out)return;
 if(o==='pc'&&!pcCode){toast('PC 스피커 연결 링크로 이 앱을 한 번 열어 주세요');return}
 const was=(playing||want)&&cur;if(was)stop();
 out=o;save('out',o);outUi();
 // PC 스피커를 고르면 꺼져 있었어도 지금(또는 마지막) 채널을 바로 PC로 보내 소리가 나게 함
 if(o==='pc'){pcListen();setTimeout(()=>play(cur||byId(load('last','kbs1fm'))||ST[0]),600)}
 else{pcClose();if(was)setTimeout(()=>play(cur),200)}};
$('#outPhone').onclick=()=>setOut('phone');$('#outPc').onclick=()=>setOut('pc');
const setCode=c=>{c=String(c||'').trim();if(!/^[A-Za-z0-9_-]{6,64}$/.test(c)){toast('연결 코드가 올바르지 않아요');return false}pcCode=c;save('pcCode',c);pcClose();return true};
// 연결 링크(…/#pc=코드)로 열면 코드를 저장하고 주소창에서 지움
{const m=location.hash.match(/^#pc=([A-Za-z0-9_-]{6,64})$/);if(m&&setCode(m[1])){history.replaceState(null,'',location.pathname);out='pc';save('out','pc');toast('PC 스피커와 연결했어요')}}
outUi();
if(out==='pc'&&pcCode){pcListen();setTimeout(()=>pcSend({a:'ping'}),500)}else if(out==='pc'){out='phone';outUi()}

// PWA: 설치 버튼 + 서비스워커
let deferred=null;const ib=$('#install');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;ib.hidden=false});
ib.onclick=async()=>{if(!deferred)return;deferred.prompt();const c=await deferred.userChoice;deferred=null;ib.hidden=true;if(c.outcome==='accepted')toast('설치했어요. 바탕화면·홈 화면에서 여세요.')};
window.addEventListener('appinstalled',()=>{ib.hidden=true});
if('serviceWorker' in navigator&&/^http/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
